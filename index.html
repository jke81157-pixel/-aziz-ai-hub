<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080815">
  <title>AZIZ AI CREATIVE HUB – Creative Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
  <style>
    :root {
      --bg: #080815; --panel: rgba(20, 20, 42, .78); --panel-solid: #15152d; --panel-2: #101024;
      --line: rgba(255, 255, 255, .11); --line-strong: rgba(255, 255, 255, .18); --text: #f7f6ff;
      --muted: #a5a3bd; --purple: #8b5cf6; --pink: #ed3aae; --cyan: #25d9ff; --lime: #b7f74a;
      --orange: #ff964f; --danger: #ff637e; --success: #74e8a1; --shadow: 0 24px 70px rgba(0, 0, 0, .35);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
      font-family: Manrope, Arial, sans-serif; overflow-x: hidden;
    }
    .app { min-height: 100vh; }
    .sidebar {
      width: 260px; position: fixed; inset: 0 auto 0 0; z-index: 40; padding: 23px 15px;
      background: rgba(11, 11, 27, .88); backdrop-filter: blur(22px); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; transition: transform .3s ease; overflow-y: auto;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 4px 10px 22px; }
    .nav { display: grid; gap: 4px; }
    .nav button {
      border: 1px solid transparent; background: transparent; display: flex; align-items: center; gap: 11px; width: 100%;
      padding: 11px 12px; border-radius: 12px; color: #c9c7df; font-weight: 600; font-size: 13.5px; cursor: pointer;
    }
    .nav button.active { background: rgba(139, 92, 246, .14); border-color: rgba(139, 92, 246, .28); color: #fff; }
    .main { margin-left: 260px; min-height: 100vh; padding: 26px 34px 70px; position: relative; }
    .view { display: none; }
    .view.active { display: block; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; margin-top: 20px; }
    .btn-primary { background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    input, textarea { width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 12px; border-radius: 10px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><strong>AZIZ AI HUB</strong></div>
      <nav class="nav">
        <button class="active" onclick="switchTab('dashboard')"><i class="ri-dashboard-line"></i> Dashboard</button>
        <button onclick="switchTab('image')"><i class="ri-image-line"></i> Image Generator</button>
        <button onclick="switchTab('video')"><i class="ri-movie-line"></i> Video Generator</button>
        <button onclick="switchTab('settings')"><i class="ri-settings-4-line"></i> API Settings</button>
      </nav>
    </aside>

    <main class="main">
      <!-- DASHBOARD -->
      <section id="view-dashboard" class="view active">
        <h2>Dashboard</h2>
        <p style="color:var(--muted)">Overview of your creative workspace</p>
        <div class="panel">
          <h3>AI Image Generator</h3>
          <p style="color:var(--muted)">Turn prompts or reference photos into new images.</p>
          <button class="btn-primary" onclick="switchTab('image')">Open Image Generator</button>
        </div>
      </section>

      <!-- IMAGE GENERATOR -->
      <section id="view-image" class="view">
        <h2>Image Generator</h2>
        <div class="panel">
          <label>Prompt</label>
          <textarea placeholder="Describe the image you want to generate..."></textarea>
          <br><br>
          <button class="btn-primary" onclick="alert('يرجى ربط API Key أولاً من الإعدادات')">Generate Image</button>
        </div>
      </section>

      <!-- VIDEO GENERATOR -->
      <section id="view-video" class="view">
        <h2>Video Generator</h2>
        <div class="panel">
          <label>Prompt</label>
          <textarea placeholder="Describe the video you want to generate..."></textarea>
          <br><br>
          <button class="btn-primary" onclick="alert('يرجى ربط API Key أولاً من الإعدادات')">Generate Video</button>
        </div>
      </section>

      <!-- SETTINGS -->
      <section id="view-settings" class="view">
        <h2>API Settings</h2>
        <div class="panel">
          <label>Replicate API Key</label>
          <input type="password" placeholder="r8_********************************">
          <br><br>
          <button class="btn-primary" onclick="alert('تم حفظ المفتاح بنجاح!')">Save Keys</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    function switchTab(tabName) {
      // إخفاء كل الصفحات
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      // إزالة التحديد عن كل الأزرار
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));

      // إظهار الصفحة المطلوبة
      const targetView = document.getElementById('view-' + tabName);
      if (targetView) targetView.classList.add('active');

      // تحديد الزر النشط
      event.currentTarget.classList.add('active');
    }
  </script>
</body>
  </html>
